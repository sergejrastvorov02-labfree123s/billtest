services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: billtest
      POSTGRES_PASSWORD: billtest
      POSTGRES_DB: billtest
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["3001:3001"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, api]
    ports: ["80:80"]
volumes:
  pg_data:
